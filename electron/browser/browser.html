<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self'" />
  <title>SDVN ComfyUI — Colab</title>
  <link rel="stylesheet" href="browser.css" />
</head>
<body>
  <header class="chrome">
    <button class="iconBtn" id="back" title="Quay lại">‹</button>
    <button class="iconBtn" id="reload" title="Tải lại (⌘R)">⟳</button>
    <button class="iconBtn" id="home" title="Về notebook SDVN ComfyUI">⌂</button>
    <div class="title" id="title">SDVN ComfyUI — Colab</div>
    <button class="actionBtn" id="useComfy" title="Dò link ComfyUI mà notebook in ra, kiểm tra chạy được rồi đặt làm server của aPix">Lấy link ComfyUI từ Colab</button>
    <button class="iconBtn" id="external" title="Mở bằng trình duyệt ngoài">↗</button>
  </header>
  <main id="views"></main>
  <div class="toast" id="toast" hidden></div>
  <script src="browser.js"></script>
</body>
</html>
